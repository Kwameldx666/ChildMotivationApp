name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            dockerfile: AuthService/AuthService.Api/Dockerfile
          - name: user-service
            dockerfile: UserService/UserService.Api/Dockerfile
          - name: task-service
            dockerfile: TaskService/TaskService.Api/Dockerfile
          - name: shop-service
            dockerfile: ShopService/ShopService.Api/Dockerfile
          - name: notification-service
            dockerfile: NotificationService/NotificationService.Api/Dockerfile
          - name: ai-service
            dockerfile: AiService/AiService.Api/Dockerfile
          - name: gateway-service
            dockerfile: GatewayService/Gateway.Api/Dockerfile
          - name: frontend
            dockerfile: Frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish image summary
        run: |
          echo "### Published ${{ matrix.service.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerfile: `${{ matrix.service.dockerfile }}`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: `${{ steps.meta.outputs.tags }}`" >> $GITHUB_STEP_SUMMARY
