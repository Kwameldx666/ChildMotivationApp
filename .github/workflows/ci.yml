name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build backend projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch "[\\/]bin[\\/]" -and $_.FullName -notmatch "[\\/]obj[\\/]" }

          foreach ($project in $projects) {
            dotnet restore $project.FullName
            dotnet build $project.FullName -c Release --no-restore
          }

      - name: Run unit tests with coverage
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Recurse -Filter *UnitTests.csproj |
            Where-Object { $_.FullName -notmatch "[\\/]bin[\\/]" -and $_.FullName -notmatch "[\\/]obj[\\/]" }

          foreach ($project in $projects) {
            dotnet test $project.FullName -c Release --no-build
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet test failed for $($project.FullName) (exit code $LASTEXITCODE)."
            }
          }

      - name: Run integration tests with coverage
        shell: pwsh
        run: |
          dotnet test GatewayService/GatewayService.IntegrationTests/IntegrationTests.csproj -c Release --no-build

      - name: Run repository guard tests
        shell: pwsh
        run: |
          dotnet test RepositoryGuard.Tests/RepositoryGuard.Tests.csproj -c Release --no-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: Frontend
        run: pnpm install --no-frozen-lockfile

      - name: Run frontend lint, tests and build
        working-directory: Frontend
        run: |
          pnpm exec eslint .
          node --test ./test/**/*.test.mjs
          pnpm run build
