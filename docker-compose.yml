version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: db_net
      POSTGRES_USER: app_owner_net
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner_net -d db_net -h postgres -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: AuthService/AuthService.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__UseDistributedStateStore: ${AUTH_USE_DISTRIBUTED_STATE_STORE:-true}
      Redis__Configuration: ${REDIS_CONFIGURATION:-redis:6379}
      ConnectionStrings__Redis: ${REDIS_CONNECTIONSTRING:-redis:6379}
      JwtBearer__Secret: ${AUTH_JWT_SECRET:-your_jwt_secret_here}

      Authentication__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID:-dev}
      Authentication__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET:-dev}
      Authentication__Google__RedirectUri: ${AUTH_GOOGLE_REDIRECT_URI}

      Authentication__Google__PostSignInRedirectUri: ${AUTH_GOOGLE_POST_SIGNIN_REDIRECT_URI:-http://localhost:3000/auth}
      Authentication__GitHub__ClientId: ${AUTH_GITHUB_CLIENT_ID:-dev}
      Authentication__GitHub__ClientSecret: ${AUTH_GITHUB_CLIENT_SECRET:-dev}
      Authentication__GitHub__RedirectUri: ${AUTH_GITHUB_REDIRECT_URI}

      Authentication__GitHub__PostSignInRedirectUri: ${AUTH_GITHUB_POST_SIGNIN_REDIRECT_URI:-http://localhost:3000/auth}
      Authentication__Discord__ClientId: ${AUTH_DISCORD_CLIENT_ID:-dev}
      Authentication__Discord__ClientSecret: ${AUTH_DISCORD_CLIENT_SECRET:-dev}
      Authentication__Discord__RedirectUri: ${AUTH_DISCORD_REDIRECT_URI}

      Authentication__Discord__PostSignInRedirectUri: ${AUTH_DISCORD_POST_SIGNIN_REDIRECT_URI:-http://localhost:3000/auth}
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION:-Host=postgres;Port=5432;Database=db_net;Username=app_owner_net;Password=postgres}
    ports:
      - "8080:8080"
    volumes:
      - auth_keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/auth-service/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: UserService/UserService.Api/Dockerfile
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      JwtBearer__Secret: ${AUTH_JWT_SECRET:-your_jwt_secret_here}
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION:-Host=postgres;Port=5432;Database=db_net;Username=app_owner_net;Password=postgres}
    ports:
      - "8082:8080"

  gateway-service:
    build:
      context: .
      dockerfile: GatewayService/Gateway.Api/Dockerfile
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      Services__AuthService: http://auth-service:8080/
      JwtBearer__Secret: ${GATEWAY_JWT_SECRET:-your_gateway_jwt_secret_here}
      ServiceEndpoints__AuthService__Register: auth-service/register
      ServiceEndpoints__AuthService__Login: auth-service/login
      Services__UserService: http://user-service:8080/
      ServiceEndpoints__UserService__Profile: user-service/profile
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION:-Host=postgres;Port=5432;Database=db_net;Username=app_owner_net;Password=postgres}
    ports:
      - "8081:8081"

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
        INTERNAL_API_URL: http://gateway-service:8081
    depends_on:
      - gateway-service
    environment:
      NEXT_PUBLIC_API_URL: http://host.docker.internal:8081
      INTERNAL_API_URL: http://gateway-service:8081
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  auth_keys:
