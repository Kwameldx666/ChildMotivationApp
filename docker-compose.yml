services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: db_net
      POSTGRES_USER: app_owner_net
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner_net -d db_net -h postgres -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: AuthService/AuthService.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__UseDistributedStateStore: true
      Redis__Configuration: redis:6379
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION:-Host=postgres;Port=5432;Database=db_net;Username=app_owner_net;Password=postgres}
      JwtBearer__Secret: ${AUTH_JWT_SECRET:-this_dev_secret_is_at_least_32_bytes_long}
      Authentication__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID:-dev}
      Authentication__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET:-dev}
      Authentication__Google__RedirectUri: ${AUTH_GOOGLE_REDIRECT_URI:-https://161.35.169.189/auth-service/google/callback}
      Authentication__Google__PostSignInRedirectUri: ${AUTH_GOOGLE_POST_SIGNIN_REDIRECT_URI:-https://161.35.169.189/auth}
      Authentication__GitHub__ClientId: ${AUTH_GITHUB_CLIENT_ID:-dev}
      Authentication__GitHub__ClientSecret: ${AUTH_GITHUB_CLIENT_SECRET:-dev}
      Authentication__GitHub__RedirectUri: ${AUTH_GITHUB_REDIRECT_URI:-https://161.35.169.189/auth-service/github/callback}
      Authentication__GitHub__PostSignInRedirectUri: ${AUTH_GITHUB_POST_SIGNIN_REDIRECT_URI:-https://161.35.169.189/auth}
      Authentication__Discord__ClientId: ${AUTH_DISCORD_CLIENT_ID:-dev}
      Authentication__Discord__ClientSecret: ${AUTH_DISCORD_CLIENT_SECRET:-dev}
      Authentication__Discord__RedirectUri: ${AUTH_DISCORD_REDIRECT_URI:-https://161.35.169.189/auth-service/discord/callback}
      Authentication__Discord__PostSignInRedirectUri: ${AUTH_DISCORD_POST_SIGNIN_REDIRECT_URI:-https://161.35.169.189/auth}
      Smtp__Host: ${SMTP_HOST:-smtp.mail.ru}
      Smtp__Port: ${SMTP_PORT:-465}
      Smtp__Username: ${SMTP_USERNAME:-wonderfulll_by@bk.ru}
      Smtp__Password: ${SMTP_PASSWORD:-H6NBUAub1WhsM1BYd0Fj}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-wonderfulll_by@bk.ru}
      Smtp__FromName: ${SMTP_FROM_NAME:-ChildMotivation}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      EmailConfirmation__FrontendBaseUrl: ${EMAIL_CONFIRMATION_FRONTEND_URL:-https://161.35.169.189}
      EmailConfirmation__ConfirmEmailPath: /confirm-email
    ports:
      - "8080:8080"
    volumes:
      - auth_keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/auth-service/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: UserService/UserService.Api/Dockerfile
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      JwtBearer__Secret: ${AUTH_JWT_SECRET:-this_dev_secret_is_at_least_32_bytes_long}
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION:-Host=postgres;Port=5432;Database=db_net;Username=app_owner_net;Password=postgres}
    volumes:
      - avatar_data:/app/wwwroot/avatars
    ports:
      - "8082:8080"

  postgres-task:
    image: postgres:15
    container_name: postgres_task_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: task_owner
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_task_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_owner -d task_db -h postgres-task -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  task-service:
    build:
      context: .
      dockerfile: TaskService/TaskService.Api/Dockerfile
    depends_on:
      postgres-task:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ANALYTICS_USE_MOCK: "true"
      ConnectionStrings__TaskService: ${TASKSERVICE_DB_CONNECTION:-Host=postgres-task;Port=5432;Database=task_db;Username=task_owner;Password=postgres}
      JwtBearer__Secret: ${AUTH_JWT_SECRET:-this_dev_secret_is_at_least_32_bytes_long}
    ports:
      - "8083:8080"
    volumes:
      - task_evidence:/app/evidence
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/task-service/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 10s

  postgres-shop:
    image: postgres:15
    container_name: postgres_shop_db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop_owner
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_shop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_owner -d shop_db -h postgres-shop -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  shop-service:
    build:
      context: .
      dockerfile: ShopService/ShopService.Api/Dockerfile
    depends_on:
      postgres-shop:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ShopService: ${SHOPSERVICE_DB_CONNECTION:-Host=postgres-shop;Port=5432;Database=shop_db;Username=shop_owner;Password=postgres}
      JwtBearer__Secret: ${AUTH_JWT_SECRET:-this_dev_secret_is_at_least_32_bytes_long}
    ports:
      - "8091:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/shop-service/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 10s

  ai-service:
    build:
      context: .
      dockerfile: AiService/AiService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      AiProvider__Provider: OpenAI
      AiProvider__BaseUrl: https://api.gptgod.online/v1/
      AiProvider__ChatEndpoint: chat/completions
      AiProvider__Model: gpt-3.5-turbo
      AiProvider__Temperature: 0.6
      AiProvider__MaxTokens: 2000
      AiProvider__TimeoutSeconds: 45
      AiProvider__ApiKey: ${OPENAI_API_KEY:-}
      JwtBearer__Secret: ${AUTH_JWT_SECRET:-this_dev_secret_is_at_least_32_bytes_long}
    ports:
      - "8095:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ai-service/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: .
      dockerfile: NotificationService/NotificationService.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${NOTIFICATION_DB_CONNECTION:-Host=postgres;Port=5432;Database=db_net;Username=app_owner_net;Password=postgres}
      Cors__AllowedOrigins__0: https://161.35.169.189
      Cors__AllowedOrigins__1: https://161.35.169.189
      Cors__AllowedOrigins__2: http://frontend:3000
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/notification-service/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 10s

  gateway-service:
    build:
      context: .
      dockerfile: GatewayService/Gateway.Api/Dockerfile
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_started
      task-service:
        condition: service_started
      shop-service:
        condition: service_started
      ai-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      Services__Auth__BaseUrl: http://auth-service:8080
      Services__Auth__TimeoutSeconds: 30
      Services__Auth__MaxRetries: 3
      Services__User__BaseUrl: http://user-service:8080
      Services__User__TimeoutSeconds: 30
      Services__User__MaxRetries: 3
      Services__Task__BaseUrl: http://task-service:8080
      Services__Task__TimeoutSeconds: 30
      Services__Task__MaxRetries: 3
      Services__Shop__BaseUrl: http://shop-service:8080
      Services__Shop__TimeoutSeconds: 30
      Services__Shop__MaxRetries: 3
      Services__Ai__BaseUrl: http://ai-service:8080
      Services__Ai__TimeoutSeconds: 60
      Services__Ai__MaxRetries: 3
      Services__Notification__BaseUrl: http://notification-service:8080
      Services__Notification__TimeoutSeconds: 30
      Services__Notification__MaxRetries: 3
      JwtBearer__Secret: ${AUTH_JWT_SECRET:-this_dev_secret_is_at_least_32_bytes_long}
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION:-Host=postgres;Port=5432;Database=db_net;Username=app_owner_net;Password=postgres}
    ports:
      - "8081:8081"

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://161.35.169.189
        INTERNAL_API_URL: http://gateway-service:8081
        NEXT_PUBLIC_SIGNALR_URL: https://161.35.169.189
    depends_on:
      - gateway-service
      - notification-service
    environment:
      NEXT_PUBLIC_API_URL: https://161.35.169.189
      INTERNAL_API_URL: http://gateway-service:8081
      NEXT_PUBLIC_SIGNALR_URL: https://161.35.169.189
    ports:
      - "4000:3000"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:latest
    container_name: k6_runner
    profiles: ["loadtest"]
    depends_on:
      - prometheus
      - gateway-service
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      BASE_URL: http://gateway-service:8081
      HEALTH_PATH: /notification-service/health
    volumes:
      - ./load-tests:/scripts:ro
    command: ["run", "-o", "experimental-prometheus-rw", "/scripts/health-smoke.js"]

volumes:
  postgres_data:
  auth_keys:
  postgres_task_data:
  postgres_shop_data:
  task_evidence:
  avatar_data:
  prometheus_data:
  grafana_data:
